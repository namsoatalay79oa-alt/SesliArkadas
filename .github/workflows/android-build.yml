
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name 'SesliArkadasAndroidStudioProjesi*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          test -d project/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sesli-Arkadas-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
